name: Sync DE Data

on:
  push:
  schedule:
    - cron: "0 0 * * *"  # Elke dag om 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-sync
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Vehicles.json
        run: |
          mkdir -p gameversions/de_DE/de_DE-Data
          curl -f -sSL --retry 3 -A "$UA" https://api.lss-manager.de/de_DE/vehicles -o gameversions/de_DE/de_DE-Data/Vehicles.json

      - name: Download Buildings.json
        run: |
          mkdir -p gameversions/de_DE/de_DE-Data
          curl -f -sSL --retry 3 -A "$UA" https://api.lss-manager.de/de_DE/buildings -o gameversions/de_DE/de_DE-Data/buildings.json


      - name: Download Pois.json
        run: |
          mkdir -p gameversions/de_DE/de_DE-Data
          curl -f -sSL --retry 3 -A "$UA" https://api.lss-manager.de/de_DE/pois -o gameversions/de_DE/de_DE-Data/pois.json
          
          
      - name: Update last update timestamp
        run: |
          # Alleen bijwerken als de data echt veranderd is, anders elke run een lege commit
          git diff --quiet -- gameversions/de_DE/de_DE-Data || date -u +"%Y-%m-%dT%H:%M:%SZ" > gameversions/de_DE/de_DE-Data/last_update_buildings.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add gameversions/de_DE/de_DE-Data/*
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Update DE vehicles, buildings & pois"
          git pull --rebase origin main
          git push origin main
