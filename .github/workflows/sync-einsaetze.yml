name: Sync einsaetze.json

on:
  push:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download einsaetze (all regions)
        run: |
          set -e

          download() {
            NAME=$1
            URL=$2
            DIR=$3

            echo "Downloading $NAME from $URL"
            mkdir -p "$DIR"
            curl -f -s -L "$URL" | jq '.' > "$DIR/einsaetze.json"
            date -u +"%Y-%m-%dT%H:%M:%SZ" > "$DIR/last_update.txt"
          }

          download "NL" "https://www.meldkamerspel.com/einsaetze.json" "gameversions/nl_NL/nl_NL-Data"
          download "DE" "https://www.leitstellenspiel.de/einsaetze.json" "gameversions/de_DE/de_DE-Data"
          download "UK" "https://www.missionchief.co.uk/einsaetze.json" "gameversions/en_UK/en_UK-Data"
          download "US" "https://www.missionchief.com/einsaetze.json" "gameversions/en_US/en_US-Data"
          download "AU" "https://www.missionchief-australia.com/einsaetze.json" "gameversions/en_AU/en_AU-Data"
          download "ES" "https://www.centro-de-mando.es/einsaetze.json" "gameversions/es_ES/es_ES-Data"



      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add gameversions/*
          git commit -m "Update einsaetze.json (all regions)" || echo "Nothing to commit"
          git push origin main
