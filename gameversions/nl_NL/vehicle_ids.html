<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voertuigen Meldkamerspel (NL)</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', sans-serif;
    background-color: #1e1e28;
    color: #dddddd;
    text-align: center;
}

.language-selector {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px auto;
    padding: 0;
}

.button {
    background-color: #2c2c3c;
    color: #dddddd;
    border: 2px solid #555566;
    padding: 8px 16px;
    text-decoration: none;
    border-radius: 8px;
    transition: background-color 0.2s, transform 0.2s;
    font-size: 12px;
}

.button:hover {
    background-color: #444456;
    transform: scale(1.05);
}

h1 {
    margin: 30px 0 10px;
    font-size: 32px;
    color: #eeeeee;
}

p {
    max-width: 800px;
    margin: 0 auto 10px;
    font-size: 15px;
    color: #cccccc;
}

#last-update {
    font-size: 13px;
    color: #aaaaaa;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 95%;
    min-width: 900px;
    max-width: 1200px;
    margin: 20px auto;
    border-collapse: collapse;
    background-color: #2a2a3a;
    border-radius: 10px;
}

thead th {
    background-color: #3a3a4a;
    padding: 12px;
    border-bottom: 2px solid #555566;
    font-size: 18px;
}

tbody td {
    padding: 12px;
    border-bottom: 1px solid #444455;
    font-size: 18px;
}

tbody tr:hover {
    background-color: #3c3c4c;
}

.button-toggle {
    background-color: #2c2c3c;
    color: #dddddd;
    border: 1px solid #555566;
    padding: 6px 14px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
}

.details-row td {
    background-color: #262632;
    text-align: left;
}

.details-content {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
    padding: 0 8px;
    font-family: 'Roboto', sans-serif;
    font-size: 17px;
    white-space: pre-line;
}

.details-content.show {
    opacity: 1;
    padding: 8px;
}

#footer {
    margin-top: 40px;
    padding: 20px;
    font-size: 12px;
    color: #888888;
}

.language-selector img {
    height: 24px;
    cursor: pointer;
    border: 2px solid #555566;
    border-radius: 4px;
}
</style>
<link rel="stylesheet" href="../../styles.css">
</head>

<body>

<ul class="language-selector">
    <li><img src="../../images/flag_nl.gif" alt="NL" onclick="changeLanguage('nl')"></li>
    <li><img src="../../images/flag_de.gif" alt="DE" onclick="changeLanguage('de')"></li>
    <li><img src="../../images/flag_uk.gif" alt="EN" onclick="changeLanguage('en')"></li>
    <li><img src="../../images/flag_us.gif" alt="EN" onclick="changeLanguage('en')"></li>
    <li><img src="../../images/flag_au.gif" alt="EN" onclick="changeLanguage('en')"></li>

    <li><a class="button" id="game-button" href="../../index.html">Startpagina</a></li>
    <li><a class="button" id="contact-button" href="../../gameversions/contact.html">Contact</a></li>
    <li><a class="button" id="back-button" href="../../gameversions/nl_NL/indexNL.html">Terug</a></li>
</ul>

<h1 id="page-title"></h1>
<p id="page-message"></p>
<p id="last-update"></p>

<div style="margin: 20px;">
    <input 
        type="text" 
        id="vehicle-search" 
        placeholder="Zoek voertuig..." 
        style="
            padding:8px 12px;
            width:300px;
            border-radius:6px;
            border:1px solid #555566;
            background-color:#2c2c3c;
            color:#dddddd;
            font-family:'Orbitron', sans-serif;
        "
    >
</div>


    
<div class="table-wrapper">
    <div id="sheet-data"></div>
</div>

<footer id="footer">
    &copy; <span id="footer-year"></span> JR04. Alle rechten voorbehouden.
</footer>

<script>
const dataFile = 'nl_NL-Data/Vehicles.json';
const buildingsFile = 'nl_NL-Data/buildings.json';
const lastUpdateFile = 'nl_NL-Data/last_update.txt';

const pageTranslations = {
    nl: {
        title: "Voertuigen",
        message: "Overzicht van alle voertuigen in Meldkamerspel (NL).",
        gameButton: "Startpagina",
        contactButton: "Contact",
        backButton: "Terug",
        searchPlaceholder: "Zoek voertuig...",
        lastUpdate: "Laatste update",
        tableHeaders: ["ID", "Naam", "Credits", "Coins", "Personeel", "Gebouwen", "Details"],
        toggle: { show: "Toon Details", hide: "Verberg Details" },
        extraLabels: {
            schooling: "Opleiding",
            waterTank: "Watertank",
            foamTank: "Schuimtank",
            waterBonus: "Waterbonus",
            pumpCapacity: "Pompcapaciteit",
            equipmentCapacity: "Opslagcapaciteit",
            special: "Bijzonderheden"
        }
    },
    de: {
        title: "Fahrzeuge",
        message: "Übersicht aller Fahrzeuge (NL).",
        gameButton: "Startseite",
        contactButton: "Kontakt",
        backButton: "Zurück",
        searchPlaceholder: "Fahrzeug suchen...",
        lastUpdate: "Letzte Aktualisierung",
        tableHeaders: ["ID", "Name", "Credits", "Coins", "Personal", "Gebäude", "Details"],
        toggle: { show: "Details anzeigen", hide: "Details verbergen" },
        extraLabels: {
            schooling: "Ausbildung",
            waterTank: "Wassermenge",
            foamTank: "Schaumtank",
            waterBonus: "Wasserbonus",
            pumpCapacity: "Pumpenleistung",
            equipmentCapacity: "Sonderlösmittelmenge",
            special: "Besonderheiten"
        }
    },
    en: {
        title: "Vehicles",
        message: "Overview of all vehicles (NL).",
        gameButton: "Homepage",
        contactButton: "Contact",
        backButton: "Back",
        searchPlaceholder: "Search vehicle...",
        lastUpdate: "Last update",
        tableHeaders: ["ID", "Name", "Credits", "Coins", "Staff", "Buildings", "Details"],
        toggle: { show: "Show Details", hide: "Hide Details" },
        extraLabels: {
            schooling: "Training",
            waterTank: "Water tank",
            foamTank: "Foam tank",
            waterBonus: "Water Bonus",
            pumpCapacity: "Pump Capacity",
            equipmentCapacity: "Storage capacity",
            special: "Special notes"
        }
    }
};


let currentLang = 'nl';

function changeLanguage(lang) {
    currentLang = lang;
    const t = pageTranslations[lang];

    document.title = t.title;
    document.getElementById('page-title').textContent = t.title;
    document.getElementById('page-message').textContent = t.message;
    document.getElementById('game-button').textContent = t.gameButton;
    document.getElementById('contact-button').textContent = t.contactButton;
    document.getElementById('back-button').textContent = t.backButton;
    document.getElementById('vehicle-search').placeholder = t.searchPlaceholder;

    loadLastUpdate();
    initVehicles();
}

async function loadLastUpdate() {
    try {
        const res = await fetch(lastUpdateFile);
        const date = new Date((await res.text()).trim());
        document.getElementById('last-update').textContent =
            `${pageTranslations[currentLang].lastUpdate}: ${date.toLocaleString()}`;
    } catch {
        document.getElementById('last-update').textContent =
            `${pageTranslations[currentLang].lastUpdate}: onbekend`;
    }
}

async function initVehicles() {
    const vehicles = await (await fetch(dataFile)).json();
    const buildings = await (await fetch(buildingsFile)).json();

    const buildingMap = {};
    Object.entries(buildings).forEach(([id, b]) => buildingMap[id] = b.caption);

    const container = document.getElementById('sheet-data');
    container.innerHTML = '';

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const tr = document.createElement('tr');

    pageTranslations[currentLang].tableHeaders.forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        tr.appendChild(th);
    });

    thead.appendChild(tr);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    Object.entries(vehicles).forEach(([id, v]) => {

        const buildingNames = (v.possibleBuildings || [])
            .map(b => buildingMap[b] || b)
            .join(', ');

        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${id}</td>
            <td>${v.caption}</td>
            <td>${v.credits}</td>
            <td>${v.coins}</td>
            <td>${v.staff.min}-${v.staff.max}</td>
            <td>${buildingNames}</td>
            <td><button class="button-toggle">${pageTranslations[currentLang].toggle.show}</button></td>
        `;
        tbody.appendChild(row);

        const detailsRow = document.createElement('tr');
        detailsRow.className = 'details-row';

        const td = document.createElement('td');
        td.colSpan = 7;

        const div = document.createElement('div');
        div.className = 'details-content';

        const labels = pageTranslations[currentLang].extraLabels;

        const detailItems = [];

        if (v.schooling) {
            let schoolingList = [];
            Object.entries(v.schooling).forEach(([discipline, positions]) => {
                Object.keys(positions).forEach(pos => {
                    schoolingList.push(`${discipline} - ${pos}`);
                });
            });
            if (schoolingList.length > 0) {
                detailItems.push(`<div><strong>${labels.schooling}:</strong> ${schoolingList.join(', ')}</div>`);
            }
        }

        if (v.waterTank != null) detailItems.push(`<div><strong>${labels.waterTank}:</strong> ${v.waterTank} l</div>`);
        if (v.foamTank != null) detailItems.push(`<div><strong>${labels.foamTank}:</strong> ${v.foamTank} l</div>`);
        if (v.waterBonus != null) detailItems.push(`<div><strong>${labels.waterBonus}:</strong> ${v.waterBonus} %</div>`);
        if (v.pumpCapacity != null) detailItems.push(`<div><strong>${labels.pumpCapacity}:</strong> ${v.pumpCapacity} l/min</div>`);
        if (v.equipmentCapacity != null) detailItems.push(`<div><strong>${labels.equipmentCapacity}:</strong> ${v.equipmentCapacity}</div>`);
        if (v.special) detailItems.push(`<div><strong>${labels.special}:</strong> ${v.special}</div>`);

        div.innerHTML = `<div class="detail-card">${detailItems.join('')}</div>`;

        td.appendChild(div);
        detailsRow.appendChild(td);
        tbody.appendChild(detailsRow);

        const btn = row.querySelector('.button-toggle');
        btn.onclick = () => {
            const open = div.classList.toggle('show');
            detailsRow.classList.toggle('show-row', open);
            div.style.maxHeight = open ? 'none' : null;
            btn.textContent = open
                ? pageTranslations[currentLang].toggle.hide
                : pageTranslations[currentLang].toggle.show;
        };
    });

    table.appendChild(tbody);
    container.appendChild(table);
}
// Zoekfunctie
document.addEventListener('input', function(e) {
    if (e.target.id !== 'vehicle-search') return;

    const search = e.target.value.toLowerCase();
    const rows = document.querySelectorAll('#sheet-data table tbody tr');

    for (let i = 0; i < rows.length; i += 2) {
        const mainRow = rows[i];
        const detailsRow = rows[i + 1];

        const text = mainRow.textContent.toLowerCase();

        if (text.includes(search)) {
            mainRow.style.display = '';
            if (detailsRow) detailsRow.style.display = '';
        } else {
            mainRow.style.display = 'none';
            if (detailsRow) detailsRow.style.display = 'none';
        }
    }
});

document.getElementById('footer-year').textContent = new Date().getFullYear();
window.addEventListener('DOMContentLoaded', () => changeLanguage(currentLang));
</script>

</body>
</html>
