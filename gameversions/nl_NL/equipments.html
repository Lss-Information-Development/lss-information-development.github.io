<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uitrusting Meldkamerspel (NL)</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Roboto', sans-serif;
    background-color: #1e1e28;
    color: #dddddd;
    text-align: center;
    line-height: 1.5;
}

h1 {
    font-family: 'Orbitron', sans-serif;
    margin: 30px 0 10px;
    font-size: 32px;
    color: #eeeeee;
    text-shadow: 0 0 5px rgba(0,0,0,0.5);
}

p {
    max-width: 800px;
    margin: 0 auto 10px;
    font-size: 15px;
    color: #cccccc;
}

#last-update {
    font-size: 13px;
    color: #aaaaaa;
}

.language-selector {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px auto;
    padding: 0;
    width: 100%;
}

.language-selector img {
    height: 24px;
    width: auto;
    cursor: pointer;
    transition: transform 0.2s, border 0.2s;
    border: 2px solid #555566;
    border-radius: 4px;
}

.language-selector img:hover {
    transform: scale(1.1);
}

.button {
    font-family: 'Orbitron', sans-serif;
    background-color: #2c2c3c;
    color: #dddddd;
    border: 2px solid #555566;
    padding: 8px 16px;
    text-decoration: none;
    border-radius: 8px;
    transition: background-color 0.2s, transform 0.2s, color 0.2s;
    font-size: 12px;
}

.button:hover {
    background-color: #444456;
    color: #ffffff;
    transform: scale(1.05);
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 95%;
    min-width: 700px;
    max-width: 1200px;
    margin: 20px auto;
    border-collapse: collapse;
    background-color: #2a2a3a;
    border-radius: 10px;
}

thead th {
    background-color: #3a3a4a;
    padding: 12px;
    border-bottom: 2px solid #555566;
    color: #eeeeee;
    font-size: 18px;
    font-family: 'Roboto', sans-serif;
}

tbody td {
    padding: 12px;
    border-bottom: 1px solid #444455;
    color: #dddddd;
    font-family: 'Roboto', sans-serif;
    font-size: 18px;
}

tbody tr:hover {
    background-color: #3c3c4c;
}

.button-toggle {
    background-color: #2c2c3c;
    color: #dddddd;
    border: 1px solid #555566;
    padding: 8px 18px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 14px;
    margin-right: 5px;
    font-family: 'Orbitron', sans-serif;
}

/* Equipment Info Rows */
.info-row td {
    background-color: #262632;
    text-align: left;
    font-size: 17px;
    color: #cccccc;
    padding: 0;
    border-top: 1px solid #444455;
}

.info-content {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
    font-family: 'Roboto', sans-serif;
    font-size: 17px;
    line-height: 1.5;
    padding: 0 15px;
}

.info-content.show {
    opacity: 1;
    padding: 12px 15px;
}

#footer {
    margin-top: 40px;
    padding: 20px;
    font-size: 12px;
    color: #888888;
}
</style>
<link rel="stylesheet" href="../../styles.css">
</head>

<body>

<ul class="language-selector">
    <li><img src="../../images/flag_nl.gif" alt="Nederlands" onclick="changeLanguage('nl')"></li>
    <li><img src="../../images/flag_de.gif" alt="Deutsch" onclick="changeLanguage('de')"></li>
    <li><img src="../../images/flag_uk.gif" alt="English" onclick="changeLanguage('en')"></li>
    <li><img src="../../images/flag_us.gif" alt="English" onclick="changeLanguage('en')"></li>
    <li><img src="../../images/flag_au.gif" alt="English" onclick="changeLanguage('en')"></li>

    <li><a class="button" id="game-button" href="../../index.html">Startpagina</a></li>
    <li><a class="button" id="contact-button" href="../../gameversions/contact.html">Contact</a></li>
    <li><a class="button" id="back-button" href="../../gameversions/nl_NL/indexNL.html">Terug</a></li>
</ul>

<h1 id="page-title"></h1>
<p id="page-message"></p>
<p id="last-update"></p>

<div class="table-wrapper">
    <div id="sheet-data"></div>
</div>

<footer id="footer">
    &copy; <span id="footer-year"></span> JR04. Alle rechten voorbehouden.
</footer>

<script>
const equipmentFile = 'nl_NL-Data/equipments.json';
const lastUpdateFile = 'nl_NL-Data/last_update_buildings.txt'; // Eventueel aanpassen naar last_update_equipments.txt indien aanwezig

const pageTranslations = {
    nl: {
        title: "Uitrusting",
        message: "Overzicht van alle uitrusting (equipment) in Meldkamerspel (NL).",
        gameButton: "Startpagina",
        contactButton: "Contact",
        backButton: "Terug",
        lastUpdate: "Laatste update",
        tableHeaders: ["ID", "Naam", "Grootte", "Credits", "Acties"],
        toggleInfo: { show: "Toon Info", hide: "Verberg Info" },
        innerLabels: {
            credits: "Credits",
            coins: "Coins",
            size: "Grootte (Capaciteit)",
            special: "Bijzonderheden",
            none: "Geen"
        }
    },
    de: {
        title: "Ausrüstung",
        message: "Übersicht aller Ausrüstungsgegenstände (NL).",
        gameButton: "Startseite",
        contactButton: "Kontakt",
        backButton: "Zurück",
        lastUpdate: "Letzte Aktualisierung",
        tableHeaders: ["ID", "Name", "Größe", "Credits", "Aktionen"],
        toggleInfo: { show: "Info anzeigen", hide: "Info verbergen" },
        innerLabels: {
            credits: "Credits",
            coins: "Coins",
            size: "Größe (Kapazität)",
            special: "Besonderheiten",
            none: "Keine"
        }
    },
    en: {
        title: "Equipment",
        message: "Overview of all equipment in Meldkamerspel (NL).",
        gameButton: "Homepage",
        contactButton: "Contact",
        backButton: "Back",
        lastUpdate: "Last update",
        tableHeaders: ["ID", "Name", "Size", "Credits", "Actions"],
        toggleInfo: { show: "Show Info", hide: "Hide Info" },
        innerLabels: {
            credits: "Credits",
            coins: "Coins",
            size: "Size (Capacity)",
            special: "Special Specs",
            none: "None"
        }
    }
};

let currentLang = 'nl';

function changeLanguage(lang) {
    currentLang = lang;
    const t = pageTranslations[lang];

    document.title = t.title;
    document.getElementById('page-title').textContent = t.title;
    document.getElementById('page-message').textContent = t.message;
    document.getElementById('game-button').textContent = t.gameButton;
    document.getElementById('contact-button').textContent = t.contactButton;
    document.getElementById('back-button').textContent = t.backButton;

    const startYear = 2024;
    const currentYear = new Date().getFullYear();
    document.getElementById('footer-year').textContent =
        startYear === currentYear ? currentYear : `${startYear} - ${currentYear}`;

    loadLastUpdate();
    initEquipment();
}

async function loadLastUpdate() {
    try {
        const res = await fetch(lastUpdateFile);
        const date = new Date((await res.text()).trim());
        document.getElementById('last-update').textContent =
            `${pageTranslations[currentLang].lastUpdate}: ${date.toLocaleString()}`;
    } catch {
        document.getElementById('last-update').textContent =
            `${pageTranslations[currentLang].lastUpdate}: onbekend`;
    }
}

async function initEquipment() {
    let equipments = [];
    try {
        const res = await fetch(equipmentFile);
        equipments = await res.json();
    } catch (e) {
        console.error("Fout bij laden van equipment JSON", e);
    }

    const container = document.getElementById('sheet-data');
    container.innerHTML = '';

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const tr = document.createElement('tr');

    pageTranslations[currentLang].tableHeaders.forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        tr.appendChild(th);
    });

    thead.appendChild(tr);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    // Omdat equipments een array van objecten is (of object), handelen we beide situaties af:
    const eqKeys = Array.isArray(equipments) ? equipments : Object.values(equipments);

    eqKeys.forEach(eq => {
        if (!eq) return;

        const row = document.createElement('tr');
        row.innerHTML = `<td>${eq.id}</td>
                         <td>${eq.name}</td>
                         <td>${eq.size || 0}</td>
                         <td>${eq.credits?.toLocaleString() || 0}</td>
                         <td>
                            <button class="button-toggle info-btn">${pageTranslations[currentLang].toggleInfo.show}</button>
                         </td>`;
        tbody.appendChild(row);

        const labels = pageTranslations[currentLang].innerLabels;

        // Info Uitklap Sectie
        const infoRow = document.createElement('tr');
        infoRow.className = 'info-row';
        const td = document.createElement('td');
        td.colSpan = 5;

        const div = document.createElement('div');
        div.className = 'info-content';

        div.innerHTML = `
            <strong>${eq.name}</strong> (ID: ${eq.id})<br>
            ${labels.credits}: ${eq.credits?.toLocaleString() || 0}<br>
            ${labels.coins}: ${eq.coins || 0}<br>
            ${labels.size}: ${eq.size || 0}<br>
            ${labels.special}: ${eq.special || labels.none}<br>
        `;

        td.appendChild(div);
        infoRow.appendChild(td);
        tbody.appendChild(infoRow);

        const toggleBtn = row.querySelector('.info-btn');
        toggleBtn.onclick = () => {
            const open = div.classList.toggle('show');
            div.style.maxHeight = open ? div.scrollHeight + 'px' : null;
            toggleBtn.textContent = open
                ? pageTranslations[currentLang].toggleInfo.hide
                : pageTranslations[currentLang].toggleInfo.show;
        };
    });

    table.appendChild(tbody);
    container.appendChild(table);
}

window.addEventListener('DOMContentLoaded', () => {
    changeLanguage(currentLang);
});
</script>

</body>
</html>
