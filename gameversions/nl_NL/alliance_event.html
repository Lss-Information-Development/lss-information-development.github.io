<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meldingen Meldkamerspel (NL)</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', sans-serif;
    background-color: #1e1e28; 
    color: #dddddd; 
    text-align: center;
}

.language-selector {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px auto;
    padding: 0;
}

.language-selector img {
    height: 24px;
    width: auto;
    cursor: pointer;
    transition: transform 0.2s, border 0.2s;
    border: 2px solid #555566;
    border-radius: 4px;
}

.language-selector img:hover {
    transform: scale(1.1);
}

.button {
    background-color: #2c2c3c; 
    color: #dddddd;
    border: 2px solid #555566;
    padding: 8px 16px;
    text-decoration: none;
    border-radius: 8px;
    transition: background-color 0.2s, transform 0.2s, color 0.2s;
    font-size: 12px;
}

.button:hover {
    background-color: #444456;
    color: #ffffff;
    transform: scale(1.05);
}

/* TABLE */
.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 95%;
    min-width: 600px;
    max-width: 1200px;
    margin: 20px auto;
    border-collapse: collapse;
    background-color: #2a2a3a; 
    border-radius: 10px;
}

thead th {
    background-color: #3a3a4a;
    padding: 12px;
    border-bottom: 2px solid #555566;
    color: #eeeeee;
    font-family: 'Roboto', sans-serif;
    font-size: 18px;
}

tbody td {
    padding: 12px;
    border-bottom: 1px solid #444455;
    color: #dddddd;
    font-family: 'Roboto', sans-serif;
    font-size: 18px;
}

tbody tr:hover {
    background-color: #3c3c4c;
}

.button-toggle {
    background-color: #2c2c3c;
    color: #dddddd;
    border: 1px solid #555566;
    padding: 6px 16px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
    margin-top: 5px;
}

.requirements-row td {
    background-color: #262632;
    text-align: left;
    font-size: 17px;
    color: #cccccc;
    font-family: 'Roboto', sans-serif;
}

.requirements-content {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
    padding: 0 8px;
    font-family: 'Roboto', sans-serif;
    font-size: 17px;
    line-height: 1.5;
}

.requirements-content.show {
    opacity: 1;
    padding: 6px 8px;
}

/* FOOTER */
#footer {
    margin-top: 40px;
    padding: 20px;
    font-size: 12px;
    color: #888888;
}

</style>
<link rel="stylesheet" href="../../styles.css">
</head>
<body>

<ul class="language-selector">
    <li><img src="../../images/flag_nl.gif" alt="Nederlands" onclick="changeLanguage('nl')"></li>
    <li><img src="../../images/flag_de.gif" alt="Deutsch" onclick="changeLanguage('de')"></li>
    <li><img src="../../images/flag_uk.gif" alt="English" onclick="changeLanguage('en')"></li>
    <li><img src="../../images/flag_us.gif" alt="English" onclick="changeLanguage('en')"></li>
    <li><img src="../../images/flag_au.gif" alt="English" onclick="changeLanguage('en')"></li>
    <li><a class="button" id="game-button" href="../../index.html">Startpagina</a></li>
    <li><a class="button" id="contact-button" href="../../gameversions/contact.html">Contact</a></li>
    <li><a class="button" id="back-button" href="../../gameversions/nl_NL/indexNL.html">Terug</a></li>
</ul>

<h1 id="page-title"></h1>
<p id="page-message"></p>

<div class="table-wrapper">
    <div id="sheet-data"></div>
</div>

<footer id="footer">
    &copy; <span id="footer-year"></span> JR04. Alle rechten voorbehouden.
</footer>

<script>
const eventsFile = 'nl_NL-Data/alliance_event_types.json';
const einsaetzeFile = 'nl_NL-Data/einsaetze.json';
const translationsFile = 'translations.json';

const pageTranslations = {
    nl: {
        title: "Meldingen Meldkamerspel",
        message: "Overzicht van allea event meldingen in Meldkamerspel (NL).",
        toggle: { show: "Toon Meldingen", hide: "Verberg Meldingen" },
        tableHeaders: ["ID", "Naam"]
    },
    de: {
        title: "Einsätze Meldkamerspiel",
        message: "Übersicht aller event Einsätze im Meldkamerspiel (NL).",
        toggle: { show: "Einsätze anzeigen", hide: "Einsätze verbergen" },
        tableHeaders: ["ID", "Name"]
    },
    en: {
        title: "Missions Control Center",
        message: "Overview of all event missions in Meldkamerspel (NL).",
        toggle: { show: "Show Missions", hide: "Hide Missions" },
        tableHeaders: ["ID", "Name"]
    }
};

let currentLang = 'nl';

function changeLanguage(lang) {
    currentLang = lang;
    const t = pageTranslations[lang];

    document.title = t.title;
    document.getElementById('page-title').textContent = t.title;
    document.getElementById('page-message').textContent = t.message;
    document.getElementById('game-button').textContent = lang==='nl'?'Startpagina':lang==='de'?'Startseite':'Homepage';
    document.getElementById('contact-button').textContent = lang==='nl'?'Contact':lang==='de'?'Kontakt':'Contact';
    document.getElementById('back-button').textContent = lang==='nl'?'Terug':lang==='de'?'Zurück':'Back';

    initMissions();
}

async function initMissions() {
    const events = await (await fetch(eventsFile)).json();
    const einsaetze = await (await fetch(einsaetzeFile)).json();

    const einsaetzeMap = {};
    einsaetze.forEach(e => { einsaetzeMap[e.id] = e.name; });

    const container = document.getElementById('sheet-data');
    container.innerHTML = '';

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const trHead = document.createElement('tr');
    pageTranslations[currentLang].tableHeaders.forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        trHead.appendChild(th);
    });
    thead.appendChild(trHead);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    events.forEach(ev => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${ev.id}</td>
            <td>${ev.caption}</td>
        `;
        tbody.appendChild(row);

        // Dropdown row
        const reqRow = document.createElement('tr');
        reqRow.className = 'requirements-row';
        const td = document.createElement('td');
        td.colSpan = 3;

        const div = document.createElement('div');
        div.className = 'requirements-content';

        if(ev.mission_type_ids && ev.mission_type_ids.length > 0){
            div.innerHTML += '<b>Mission Types:</b> ';
            div.innerHTML += ev.mission_type_ids.map(id => einsaetzeMap[id]?`${id} - ${einsaetzeMap[id]}`:id).join(', ');
            div.innerHTML += '<br>';
        }

        if(ev.requirements){
            div.innerHTML += '<b>Meldingen:</b><br>';
            for(const k in ev.requirements){
                div.innerHTML += `${k}: ${ev.requirements[k]}<br>`;
            }
        }

        td.appendChild(div);
        reqRow.appendChild(td);
        tbody.appendChild(reqRow);

        // Toggle button
        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'button-toggle';
        toggleBtn.textContent = pageTranslations[currentLang].toggle.show;
        row.cells[1].appendChild(document.createElement('br'));
        row.cells[1].appendChild(toggleBtn);

        toggleBtn.onclick = () => {
            const open = div.classList.toggle('show');
            div.style.maxHeight = open ? div.scrollHeight + 'px' : null;
            toggleBtn.textContent = open ? pageTranslations[currentLang].toggle.hide : pageTranslations[currentLang].toggle.show;
        };
    });

    table.appendChild(tbody);
    container.appendChild(table);
}

document.getElementById('footer-year').textContent = new Date().getFullYear();

window.addEventListener('DOMContentLoaded', () => {
    changeLanguage(currentLang);
});
</script>

</body>
</html>
