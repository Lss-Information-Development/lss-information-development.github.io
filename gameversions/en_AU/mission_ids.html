<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missions Missionchief (AU)</title>


<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', sans-serif;
    background-color: #1e1e28; 
    color: #dddddd; 
    text-align: center;
}

.language-selector {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px auto;
    padding: 0;
}

.button {
    background-color: #2c2c3c; 
    color: #dddddd;
    border: 2px solid #555566;
    padding: 8px 16px;
    text-decoration: none;
    border-radius: 8px;
    transition: background-color 0.2s, transform 0.2s, color 0.2s;
    font-size: 12px;
}

.button:hover {
    background-color: #444456;
    color: #ffffff;
    transform: scale(1.05);
}

/* TITLES */
h1 {
    margin: 30px 0 10px;
    font-size: 32px;
    color: #eeeeee;
    text-shadow: 0 0 5px rgba(0,0,0,0.5);
}

p {
    max-width: 800px;
    margin: 0 auto 10px;
    font-size: 15px;
    color: #cccccc;
}

#last-update {
    font-size: 13px;
    color: #aaaaaa;
}

/* SWIPE HINT */
#swipe-hint {
    display: none;
    font-size: 12px;
    color: #bbbbbb;
    margin: 8px auto 5px;
    text-align: center;
    opacity: 0.9;
}

/* TABLE */
.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 95%;
    min-width: 900px;
    max-width: 1200px;
    margin: 20px auto;
    border-collapse: collapse;
    background-color: #2a2a3a; 
    border-radius: 10px;
}

thead th {
    background-color: #3a3a4a;
    padding: 12px;
    border-bottom: 2px solid #555566;
    color: #eeeeee;
    font-family: 'Roboto', sans-serif;
    font-size: 18px;
}

tbody td {
    padding: 12px;
    border-bottom: 1px solid #444455;
    color: #dddddd;
    font-family: 'Roboto', sans-serif;
    font-size: 18px;
}

tbody tr:hover {
    background-color: #3c3c4c;
}

/* REQUIREMENTS */
.button-toggle {
    background-color: #2c2c3c;
    color: #dddddd;
    border: 1px solid #555566;
    padding: 6px 16px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
}

.requirements-row td {
    background-color: #262632;
    text-align: left;
    font-size: 17px;
    color: #cccccc;
    font-family: 'Roboto', sans-serif;
}

.requirements-content {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
    padding: 0 8px;
    font-family: 'Roboto', sans-serif;
    font-size: 17px;
    line-height: 1.5;
}

.requirements-content.show {
    opacity: 1;
    padding: 6px 8px;
}

/* FOOTER */
#footer {
    margin-top: 40px;
    padding: 20px;
    font-size: 12px;
    color: #888888;
}

.language-selector img {
    height: 24px;
    width: auto;
    cursor: pointer;
    transition: transform 0.2s, border 0.2s;
    border: 2px solid #555566;
    border-radius: 4px;
}

.language-selector img:hover {
    transform: scale(1.1);
}

/* MOBILE FLAGS */
@media (max-width: 600px) {
    .language-selector img {
        height: 22px;
        width: auto;
    }
}
</style>
<link rel="stylesheet" href="../../styles.css">
</head>

<body>

<ul class="language-selector">
    <li><img src="../../images/flag_nl.gif" alt="Nederlands" onclick="changeLanguage('nl')"></li>
    <li><img src="../../images/flag_de.gif" alt="Deutsch" onclick="changeLanguage('de')"></li>
    <li><img src="../../images/flag_uk.gif" alt="English" onclick="changeLanguage('en')"></li>
    <li><img src="../../images/flag_us.gif" alt="English" onclick="changeLanguage('en')"></li>
    <li><img src="../../images/flag_au.gif" alt="English" onclick="changeLanguage('en')"></li>

    
    <li><a class="button" id="game-button" href="../../index.html">Startpagina</a></li>
    <li><a class="button" id="contact-button" href="../../gameversions/contact.html">Contact</a></li>
    <li><a class="button" id="back-button" href="../../gameversions/en_AU/indexAU.html">Terug</a></li>
</ul>

<h1 id="page-title"></h1>
<p id="page-message"></p>
<p id="last-update"></p>

<div id="swipe-hint"></div>


<div style="margin: 20px;">
    <input 
        type="text" 
        id="mission-search" 
        placeholder="Search mission..." 
        style="
            padding:8px 12px;
            width:300px;
            border-radius:6px;
            border:1px solid #555566;
            background-color:#2c2c3c;
            color:#dddddd;
            font-family:'Orbitron', sans-serif;
        "
    >
</div>

    
<div class="table-wrapper">
    <div id="sheet-data"></div>
</div>

<footer id="footer">
    &copy; <span id="footer-year"></span> JR04. Alle rechten voorbehouden.
</footer>

<script>
const dataFile = 'en_AU-Data/einsaetze.json';
const lastUpdateFile = 'en_AU-Data/last_update.txt';

const pageTranslations = {
    nl: {
        title: "Melding IDs",
        message: "Overzicht van alle meldingen (AU).",
        gameButton: "Startpagina",
        contactButton: "Contact",
        backButton: "Terug",
        searchPlaceholder: "Melding zoeken...",
        lastUpdate: "Laatste update",
        swipeHint: "← swipe naar links of rechts om de tabel te bekijken →",
        tableHeaders: ["ID", "Naam", "POI", "Gemiddelde Credits"]
    },
    de: {
        title: "Einsätze IDs",
        message: "Hier finden Sie eine Übersicht aller Einsätze (AU).",
        gameButton: "Startseite",
        contactButton: "Kontakt",
        backButton: "Zurück",
        searchPlaceholder: "Einsätze suchen...",
        lastUpdate: "Letzte Aktualisierung",
        swipeHint: "← nach links oder rechts wischen, um die Tabelle zu sehen →",
        tableHeaders: ["ID", "Name", "POI", "Durchschnittliche Credits"]
    },
    en: {
        title: "Mission IDs",
        message: "Here you can find an overview of all missions (AU).",
        gameButton: "Homepage",
        contactButton: "Contact",
        backButton: "Back",
        searchPlaceholder: "Search mission...",
        lastUpdate: "Last update",
        swipeHint: "← swipe left or right to view the table →",
        tableHeaders: ["ID", "Name", "POI", "Average Credits"]
    }
};

let currentLang = 'en';

function changeLanguage(lang) {
    currentLang = lang;
    const t = pageTranslations[lang];

    document.title = t.title;
    document.getElementById('page-title').textContent = t.title;
    document.getElementById('page-message').textContent = t.message;
    document.getElementById('game-button').textContent = t.gameButton;
    document.getElementById('contact-button').textContent = t.contactButton;
    document.getElementById('back-button').textContent = t.backButton;
    document.getElementById('swipe-hint').textContent = t.swipeHint;

    loadLastUpdate();
    initMissions();
}

async function loadLastUpdate() {
    try {
        const res = await fetch(lastUpdateFile);
        const date = new Date((await res.text()).trim());
        document.getElementById('last-update').textContent =
            `${pageTranslations[currentLang].lastUpdate}: ${date.toLocaleString()}`;
    } catch {
        document.getElementById('last-update').textContent =
            `${pageTranslations[currentLang].lastUpdate}: onbekend`;
    }
}

async function initMissions() {
    const missions = await (await fetch(dataFile)).json();

    const container = document.getElementById('sheet-data');
    container.innerHTML = '';

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const tr = document.createElement('tr');

    pageTranslations[currentLang].tableHeaders.forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        tr.appendChild(th);
    });

    thead.appendChild(tr);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    missions.forEach(m => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${m.id}</td>
            <td>${m.name}</td>
            <td>${(m.place_array || []).join(', ')}</td>
            <td>${m.average_credits}</td>
        `;
        tbody.appendChild(row);
    });

    table.appendChild(tbody);
    container.appendChild(table);
}


// Zoekfunctie
document.addEventListener('input', function(e) {
    if (e.target.id !== 'mission-search') return;

    const search = e.target.value.toLowerCase();
    const rows = document.querySelectorAll('#sheet-data table tbody tr');

    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const isRequirements = row.classList.contains('requirements-row');

        if (isRequirements) {
            // dropdown volgt op hoofdregel; display matcht gewoon de hoofdregel
            continue;
        }

        const text = row.textContent.toLowerCase();
        const show = text.includes(search);
        row.style.display = show ? '' : 'none';

        // verberg of toon direct de volgende requirements-row
        const nextRow = row.nextElementSibling;
        if (nextRow && nextRow.classList.contains('requirements-row')) {
            nextRow.style.display = show ? '' : 'none';
        }
    }
});

    
document.getElementById('footer-year').textContent = new Date().getFullYear();
window.addEventListener('DOMContentLoaded', () => changeLanguage(currentLang));
</script>

</body>
</html>
