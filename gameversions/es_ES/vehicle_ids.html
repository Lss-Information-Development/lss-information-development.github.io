<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicles Centro de Mando (ES)</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', sans-serif;
    background-color: #1e1e28;
    color: #dddddd;
    text-align: center;
}

.language-selector {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px auto;
    padding: 0;
    width: 100%;
}

.button {
    background-color: #2c2c3c;
    color: #dddddd;
    border: 2px solid #555566;
    padding: 8px 16px;
    text-decoration: none;
    border-radius: 8px;
    transition: background-color 0.2s, transform 0.2s, color 0.2s;
    font-size: 12px;
}

.button:hover {
    background-color: #444456;
    color: #ffffff;
    transform: scale(1.05);
}

h1 {
    margin: 30px 0 10px;
    font-size: 32px;
    color: #eeeeee;
    text-shadow: 0 0 5px rgba(0,0,0,0.5);
}

p {
    max-width: 800px;
    margin: 0 auto 10px;
    font-size: 15px;
    color: #cccccc;
}

#last-update {
    font-size: 13px;
    color: #aaaaaa;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 95%;
    min-width: 900px;
    max-width: 1200px;
    margin: 20px auto;
    border-collapse: collapse;
    background-color: #2a2a3a;
    border-radius: 10px;
}

thead th {
    background-color: #3a3a4a;
    padding: 12px;
    border-bottom: 2px solid #555566;
    color: #eeeeee;
    font-family: 'Roboto', sans-serif;
    font-size: 18px;
}

tbody td {
    padding: 12px;
    border-bottom: 1px solid #444455;
    color: #dddddd;
    font-family: 'Roboto', sans-serif;
    font-size: 18px;
}

tbody tr:hover {
    background-color: #3c3c4c;
}

.language-selector img {
    height: 24px;
    width: auto;
    cursor: pointer;
    transition: transform 0.2s;
    border: 2px solid #555566;
    border-radius: 4px;
}

.language-selector img:hover {
    transform: scale(1.1);
}

#footer {
    margin-top: 40px;
    padding: 20px;
    font-size: 12px;
    color: #888888;
}
</style>
<link rel="stylesheet" href="../../styles.css">
</head>

<body>

<ul class="language-selector">
    <li><img src="../../images/flag_nl.gif" alt="Nederlands" onclick="changeLanguage('nl')"></li>
    <li><img src="../../images/flag_de.gif" alt="Deutsch" onclick="changeLanguage('de')"></li>
    <li><img src="../../images/flag_uk.gif" alt="English" onclick="changeLanguage('en')"></li>
    <li><img src="../../images/flag_us.gif" alt="English" onclick="changeLanguage('en')"></li>
    <li><img src="../../images/flag_au.gif" alt="English" onclick="changeLanguage('en')"></li>

    <li><a class="button" id="game-button" href="../../index.html">Startpagina</a></li>
    <li><a class="button" id="contact-button" href="../../gameversions/contact.html">Contact</a></li>
    <li><a class="button" id="back-button" href="../../gameversions/es_ES/indexES.html">Terug</a></li>
</ul>

<h1 id="page-title"></h1>
<p id="page-message"></p>
<p id="last-update"></p>

<div class="table-wrapper">
    <div id="sheet-data"></div>
</div>

<footer id="footer">
    &copy; <span id="footer-year"></span> JR04. Alle rechten voorbehouden.
</footer>

<script>
const dataFile = 'es_ES-Data/vehicles.json';
const buildingsFile = 'es_ES-Data/buildings.json';
const lastUpdateFile = 'es_ES-Data/last_update.txt';

const pageTranslations = {
    nl: {
        title: "Voertuigen",
        message: "Overzicht van alle voertuigen in Centro de Mando (ES).",
        gameButton: "Startpagina",
        contactButton: "Contact",
        backButton: "Terug",
        lastUpdate: "Laatste update",
        tableHeaders: ["ID", "Naam", "Credits", "Coins", "Personeel min-max", "Gebouwen", "Opslagcapaciteit"]
    },
    de: {
        title: "Fahrzeuge",
        message: "Übersicht aller Fahrzeuge (ES).",
        gameButton: "Startseite",
        contactButton: "Kontakt",
        backButton: "Zurück",
        lastUpdate: "Letzte Aktualisierung",
        tableHeaders: ["ID", "Name", "Credits", "Coins", "Personal min-max", "Gebäude", "Lagermenge"]
    },
    en: {
        title: "Vehicles",
        message: "Overview of all vehicles (ES).",
        gameButton: "Homepage",
        contactButton: "Contact",
        backButton: "Back",
        lastUpdate: "Last update",
        tableHeaders: ["ID", "Name", "Credits", "Coins", "Staff min-max", "Buildings", "Storage"]
    }
};

let currentLang = 'en';

function changeLanguage(lang) {
    currentLang = lang;
    const t = pageTranslations[lang];

    document.title = t.title;
    document.getElementById('page-title').textContent = t.title;
    document.getElementById('page-message').textContent = t.message;
    document.getElementById('game-button').textContent = t.gameButton;
    document.getElementById('contact-button').textContent = t.contactButton;
    document.getElementById('back-button').textContent = t.backButton;

    loadLastUpdate();
    initVehicles();
}

async function loadLastUpdate() {
    try {
        const res = await fetch(lastUpdateFile);
        const date = new Date((await res.text()).trim());
        document.getElementById('last-update').textContent =
            `${pageTranslations[currentLang].lastUpdate}: ${date.toLocaleString()}`;
    } catch {
        document.getElementById('last-update').textContent =
            `${pageTranslations[currentLang].lastUpdate}: onbekend`;
    }
}

async function initVehicles() {
    const vehiclesData = await (await fetch(dataFile)).json();
    const buildingsData = await (await fetch(buildingsFile)).json();

    // Mapping van buildingID -> caption
    const buildingMap = {};
    Object.entries(buildingsData).forEach(([id, b]) => {
        buildingMap[id] = b.caption;
    });

    const container = document.getElementById('sheet-data');
    container.innerHTML = '';

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const tr = document.createElement('tr');

    pageTranslations[currentLang].tableHeaders.forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        tr.appendChild(th);
    });

    thead.appendChild(tr);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    Object.entries(vehiclesData).forEach(([id, v]) => {
        const buildingNames = (v.possibleBuildings || []).map(bid => buildingMap[bid] || bid);

        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${id}</td>
            <td>${v.caption}</td>
            <td>${v.credits}</td>
            <td>${v.coins}</td>
            <td>${v.staff.min}-${v.staff.max}</td>
            <td>${buildingNames.join(', ')}</td>
            <td>${v.equipmentCapacity ?? 0}</td>
        `;
        tbody.appendChild(row);
    });

    table.appendChild(tbody);
    container.appendChild(table);
}

document.getElementById('footer-year').textContent = new Date().getFullYear();
window.addEventListener('DOMContentLoaded', () => changeLanguage(currentLang));
</script>

</body>
</html>
