<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>
/* BASE */
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', sans-serif;
    background-color: #1e1e28;
    color: #dddddd;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    text-align: center;
}

/* HEADER & FOOTER */
header, footer {
    background-color: #2a2a3a;
    padding: 20px;
    border-bottom: 2px solid #555566;
}

footer {
    border-top: 2px solid #555566;
    margin-top: auto;
    font-size: 12px;
    color: #aaaaaa;
}

/* TITLES */
h1 {
    margin: 10px 0;
    font-size: 32px;
    color: #eeeeee;
}

p {
    margin: 10px 0;
    color: #cccccc;
}

/* LANGUAGE SELECTOR */
.language-selector {
    list-style: none;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px auto;
    padding: 0;
}

.language-selector img {
    height: 24px;
    width: auto;
    cursor: pointer;
    border: 2px solid #555566;
    border-radius: 4px;
    transition: transform 0.2s;
}

.language-selector img:hover {
    transform: scale(1.1);
}

/* MAIN */
main {
    padding: 50px 20px;
    position: relative;
}

/* CARD */
.neon-box {
    background-color: #2a2a3a;
    border: 2px solid #555566;
    border-radius: 18px;
    padding: 45px 40px;
    max-width: 600px;
    margin: 0 auto 30px auto;
}

/* BUTTONS */
.button-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.button {
    background-color: #2c2c3c;
    color: #dddddd;
    border: 2px solid #555566;
    padding: 16px 26px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 16px;
    min-width: 200px;
    transition: background-color 0.2s, transform 0.2s, color 0.2s;
}

.button:hover {
    background-color: #444456;
    color: #ffffff;
    transform: scale(1.05);
}

/* SHAPES */
.shape-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: -1;
}

.shape-bg div {
    position: absolute;
    border: 2px solid #55556655;
    border-radius: 50%;
    animation: float 20s infinite linear;
}

.shape1 { width: 200px; height: 200px; top: 10%; left: 10%; }
.shape2 { width: 300px; height: 300px; bottom: 10%; right: 15%; }

@keyframes float {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.2); }
    100% { transform: rotate(360deg) scale(1); }
}

/* MOBILE */
@media (max-width: 600px) {
    main { padding: 20px 10px; }
    .neon-box { padding: 25px 20px; }
    .button { font-size: 15px; padding: 14px 20px; }
}
</style>
<link rel="stylesheet" href="../styles.css">
</head>

<body>

<header>
    <h1 id="contact-title">Contact</h1>
</header>

<ul class="language-selector">
    <li><img src="../images/flag_nl.gif" alt="NL" onclick="changeLanguage('nl')"></li>
    <li><img src="../images/flag_de.gif" alt="DE" onclick="changeLanguage('de')"></li>
    <li><img src="../images/flag_uk.gif" alt="UK" onclick="changeLanguage('en')"></li>
    <li><img src="../images/flag_us.gif" alt="US" onclick="changeLanguage('en')"></li>
    <li><img src="../images/flag_au.gif" alt="AU" onclick="changeLanguage('en')"></li>
</ul>

<main>
    <div class="shape-bg">
        <div class="shape1"></div>
        <div class="shape2"></div>
    </div>

    <div class="neon-box">
        <p id="contact-note">
            Voor vragen kunt u een bericht sturen naar "jr04." op Discord.
        </p>
    </div>

    <div class="button-container">
        <a class="button" id="back-button" href="../index.html">Terug</a>
        <a class="button" id="gameversions-button" href="../gameversions/gameversionsinfo.html">Gameversions</a>
    </div>
</main>

<footer id="footer">
    &copy; <span id="year"></span> JR04. Alle rechten voorbehouden.
    Gebruik van onderdelen vanaf deze site is zonder schriftelijke toestemming verboden.
</footer>

<script>
/* ===== BASIS ===== */
const startYear = 2024;
const currentYear = new Date().getFullYear();
document.getElementById('year').textContent =
    startYear === currentYear ? currentYear : `${startYear} - ${currentYear}`;

/* ===== TAAL ===== */
function changeLanguage(lang) {
    const title = document.getElementById('contact-title');
    const note = document.getElementById('contact-note');
    const backBtn = document.getElementById('back-button');
    const gameBtn = document.getElementById('gameversions-button');
    const footer = document.getElementById('footer');

    if (lang === "nl") {
        document.title = "Contact";
        title.textContent = "Contact";
        note.textContent = "Voor vragen kunt u een bericht sturen naar \"jr04.\" op Discord.";
        backBtn.textContent = "Terug";
        gameBtn.textContent = "Gameversions";
        footer.innerHTML = `&copy; ${startYear} - ${currentYear} JR04. Alle rechten voorbehouden.
        Gebruik van onderdelen vanaf deze site is zonder schriftelijke toestemming verboden.`;
    }

    if (lang === "de") {
        document.title = "Kontakt";
        title.textContent = "Kontakt";
        note.textContent = "Bei Fragen können Sie eine Nachricht an \"jr04.\" auf Discord senden.";
        backBtn.textContent = "Zurück";
        gameBtn.textContent = "Spielversionen";
        footer.innerHTML = `&copy; ${startYear} - ${currentYear} JR04. Alle Rechte vorbehalten.
        Die Verwendung von Teilen dieser Website ist ohne schriftliche Genehmigung untersagt.`;
    }

    if (lang === "en") {
        document.title = "Contact";
        title.textContent = "Contact";
        note.textContent = "For questions, please send a message to \"jr04.\" on Discord.";
        backBtn.textContent = "Back";
        gameBtn.textContent = "Gameversions";
        footer.innerHTML = `&copy; ${startYear} - ${currentYear} JR04. All rights reserved.
        Use of components from this site is prohibited without written permission.`;
    }
}

/* ===== INIT ===== */
changeLanguage("nl");
</script>

</body>
</html>
